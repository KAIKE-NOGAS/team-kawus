<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1A1A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="#0A0A0C" stroke="#FF1A1A" stroke-width="4"/>
  <circle cx="256" cy="256" r="240" fill="url(#glow)"/>
  
  <!-- Skull -->
  <g transform="translate(256,230)" fill="#e5e5e5">
    <!-- Cranium -->
    <ellipse cx="0" cy="-30" rx="55" ry="50"/>
    <!-- Jaw -->
    <path d="M-40,0 Q-45,35 -20,40 L-10,42 L0,35 L10,42 L20,40 Q45,35 40,0 Z"/>
    <!-- Eye sockets -->
    <ellipse cx="-20" cy="-30" rx="16" ry="14" fill="#0A0A0C"/>
    <ellipse cx="20" cy="-30" rx="16" ry="14" fill="#0A0A0C"/>
    <!-- Sharingan left eye -->
    <circle cx="-20" cy="-30" r="7" fill="#CC0000"/>
    <circle cx="-20" cy="-30" r="3" fill="#0A0A0C"/>
    <!-- Sharingan right eye -->
    <circle cx="20" cy="-30" r="7" fill="#CC0000"/>
    <circle cx="20" cy="-30" r="3" fill="#0A0A0C"/>
    <!-- Nose -->
    <path d="M-5,-10 L0,-3 L5,-10" stroke="#0A0A0C" stroke-width="2" fill="none"/>
    <!-- Teeth -->
    <line x1="-15" y1="20" x2="-15" y2="30" stroke="#0A0A0C" stroke-width="2"/>
    <line x1="-5" y1="20" x2="-5" y2="32" stroke="#0A0A0C" stroke-width="2"/>
    <line x1="5" y1="20" x2="5" y2="32" stroke="#0A0A0C" stroke-width="2"/>
    <line x1="15" y1="20" x2="15" y2="30" stroke="#0A0A0C" stroke-width="2"/>
  </g>

  <!-- Soldier Left -->
  <g transform="translate(140,290)" fill="#333">
    <ellipse cx="0" cy="-15" rx="22" ry="25" fill="#444"/>
    <rect x="-20" y="0" width="40" height="55" rx="5" fill="#333"/>
    <rect x="-7" y="-22" width="14" height="10" rx="3" fill="#555"/>
    <rect x="-15" y="-5" width="30" height="8" rx="2" fill="#222"/>
    <!-- Eyes -->
    <rect x="-10" y="-18" width="7" height="3" rx="1" fill="#FF1A1A" opacity="0.8"/>
    <rect x="3" y="-18" width="7" height="3" rx="1" fill="#FF1A1A" opacity="0.8"/>
  </g>

  <!-- Soldier Right -->
  <g transform="translate(372,290)" fill="#333">
    <ellipse cx="0" cy="-15" rx="22" ry="25" fill="#444"/>
    <rect x="-20" y="0" width="40" height="55" rx="5" fill="#333"/>
    <rect x="-7" y="-22" width="14" height="10" rx="3" fill="#555"/>
    <rect x="-15" y="-5" width="30" height="8" rx="2" fill="#222"/>
    <!-- Eyes -->
    <rect x="-10" y="-18" width="7" height="3" rx="1" fill="#FF1A1A" opacity="0.8"/>
    <rect x="3" y="-18" width="7" height="3" rx="1" fill="#FF1A1A" opacity="0.8"/>
  </g>

  <!-- Text: TEAM KAWUS -->
  <text x="256" y="410" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="42" fill="white" letter-spacing="4">TEAM</text>
  <text x="256" y="460" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="50" fill="#FF1A1A" letter-spacing="6">KAWUS</text>
</svg>
